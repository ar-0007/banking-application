spec:
  template:
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: banking-api
        image: 650435901299.dkr.ecr.ap-southeast-2.amazonaws.com/banking-api:health-checks-20261103-v1
        env:
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: postgres-service
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: banking_db
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: DB_SSL
          value: "false"
        startupProbe:
          httpGet:
            path: /live
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /live
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - node
              - -e
              - setTimeout(() => {}, 10000)
