apiVersion: v1
kind: Service
metadata:
  name: banking-api-external
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: banking-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000