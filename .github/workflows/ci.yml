name: Continuous Integration

on:
  push:
    branches: ["dev", "developer"]
  pull_request:
    branches: ["dev"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test
        env:
          DB_PASSWORD: "dummy_password_for_testing"
          DB_USER: "dummy_user"
          DB_HOST: "localhost"
          DB_NAME: "test_db"
          DB_PORT: "5432"